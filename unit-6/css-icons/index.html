<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Icons Demo</title>
    <link rel="stylesheet" href="css-icons.css">
    <link rel="stylesheet" href="/dist/styles.css">
</head>
<body>
    <header>
        <load src="/src/components/nav.html" />
    </header>

    <main>
        <!-- The wrapper sets a color to prove currentColor works -->
        <div class="icon-wrapper" style="color: #2563eb;">
            
            <!-- Icon 1: Hamburger Menu (Uses ::before and ::after) -->
            <button class="hamburger-btn" aria-expanded="false" aria-label="Toggle menu">
                <span class="hamburger-icon"></span>
            </button>

            <!-- Icon 2: Play Button (Built with borders) -->
            <button class="play-btn" aria-pressed="false" aria-label="Toggle play">
                <span class="play-icon"></span>
            </button>

            <!-- Icon 3: Search Magnifying Glass (Built with borders and ::after) -->
            <div class="search-icon" aria-label="Search" role="img"></div>

        </div>
    </main>

    <script>
        // Handle the aria-expanded state for the hamburger morph
        const menuBtn = document.querySelector('.hamburger-btn');
        
        menuBtn.addEventListener('click', () => {
            const isExpanded = menuBtn.getAttribute('aria-expanded') === 'true';
            menuBtn.setAttribute('aria-expanded', !isExpanded);
        });

        // Handle the aria-pressed state for the play morph
        const playBtn = document.querySelector('.play-btn');

        playBtn.addEventListener('click', () => {
            const isPressed = playBtn.getAttribute('aria-pressed') === 'true';
            playBtn.setAttribute('aria-pressed', !isPressed);
        });
    </script>
</body>
</html>
