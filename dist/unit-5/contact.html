            <svg class="theme-icon" aria-hidden="true" focusable="false">

        </label>
        
        <label class="theme-label">
            <input type="radio" name="theme-preference" value="system" checked>
            <svg class="theme-icon" aria-hidden="true" focusable="false">

            </svg>

        <label class="theme-label">

    <main class="contact-container">
        <form class="contact-form" action="https://formspree.io/f/xayaoqej" method="POST">
            <a href="/index.html" class="back-link">← Back to Portfolio</a>
            <h2>Contact Us</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="_replyto" required>
            <div class="form-group">
                <input type="checkbox" id="phone-agree" name="phone-agree">
                <label for="phone-agree">Check to include my phone number</label>
            </div>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </main>

    <script>
        const phoneCheckbox = document.getElementById('phone-agree');
        const phoneFieldGroup = document.getElementById('phone-field-group');
        const phoneInput = document.getElementById('phone');

        phoneCheckbox.addEventListener('change', function() {
            if (this.checked) {
                phoneFieldGroup.style.display = 'block';
                phoneInput.setAttribute('required', '');
            } else {
                phoneFieldGroup.style.display = 'none';
                phoneInput.removeAttribute('required');
                phoneInput.value = ''; // Clear input if unchecked
            }
        });
    </script>
</body>
