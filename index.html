<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD331R - Home</title>
    <script src="src/js/theme-preference.js"></script>
    <link rel="stylesheet" href="dist/styles.css">
</head>
<body>
    <header class="home-header">
        <h1>Spencer Ashcraft</h1>
        <p>WDD 331R Advanced CSS</p>

        <details class="theme-switcher">
            <summary class="theme-control">
                <span class="visually-hidden">Theme scheme</span>
            </summary>
            <div class="theme-extra" role="group" aria-label="Choose color scheme">
                <label class="theme-label">
                    <input type="radio" name="theme-preference" value="light">
                    <span aria-hidden="true">☀️</span>
                    <span>Light</span>
                </label>
                
                <label class="theme-label">
                    <input type="radio" name="theme-preference" value="system" checked>
                    <span aria-hidden="true">⚙️</span>
                    <span>System</span>
                </label>
                
                <label class="theme-label">
                    <input type="radio" name="theme-preference" value="dark">
                    <span aria-hidden="true">🌖</span>
                    <span>Dark</span>
                </label>
            </div>
        </details>
    </header>

    <main>
        <section class="links-space">
            <h2>Assignments</h2>
            <nav class="unit-links-nav">
                <div class="unit-group">
                    <h3>Unit 1</h3>
                    <ul>
                        <li>
                            <a href="unit-1/custom-properties/index.html">
                                Custom Properties and Nesting
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="unit-group">
                    <h3>Unit 2</h3>
                    <ul>
                        <li>
                            <a href="unit-2/layered-components/index.html">
                                Layered Components
                            </a>
                        </li>
                        <li>
                            <a href="unit-2/lightning-css-demo/index.html">
                                Lightning CSS Demo
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="unit-group">
                    <h3>Unit 3</h3>
                    <ul>
                        <li>
                            <a href="unit-3/visual-effects/index.html">
                                Visual Effects
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </section>
    </main>
</body>
</html>
